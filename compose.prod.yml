# Runtime definition for the EC2 box. Copied to /opt/pinch/compose.yml by the
# deploy workflow (.github/workflows/deploy.yml) together with a generated .env
# that holds APP_SECRET, DATABASE_URL, CORS_ALLOW_ORIGIN, DEFAULT_URI, SERVER_NAME
# and BACKEND_IMAGE_TAG. The database is Neon, so this is the only service.
#
# TLS terminates here: SERVER_NAME="api.pinchapp.fyi, :8000" makes Caddy serve the
# hostname on 80/443 with an automatic Let's Encrypt certificate (80 also answers
# the ACME challenge and redirects to https), while :8000 stays a plain-HTTP
# listener that is NOT published - only the image's HEALTHCHECK uses it.
services:
  backend:
    image: ghcr.io/maciej-jedral/pinch-backend:${BACKEND_IMAGE_TAG:?set by the deploy workflow}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates + ACME account (Caddy's XDG dirs in the frankenphp image).
      # Lost on instance replacement -> Caddy simply re-issues.
      - caddy_data:/data
      - caddy_config:/config
    # healthcheck comes from the image (see Dockerfile); `up --wait` relies on it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
